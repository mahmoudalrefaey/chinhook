# Adds a sample database to connect to: PostgreSQL with the Chinook dataset (a music store:
# artists, albums, tracks, customers, invoices) and a read-only login already created.
# Layer this on top of docker-compose.yml rather than running it alone:
#
#   docker compose -f docker-compose.yml -f docker-compose.local-db.yml up
#
# Then, on the app's setup screen, connect with this URL (SSL: disable), using the
# CHINOOK_RO_PASSWORD below or the one set in .env:
#
#   postgresql://chinhook_ro:chinook_ro_local_dev@postgres:5432/chinook

services:
  postgres:
    image: postgres:16
    environment:
      # Left at the image's own default database ("postgres"), not "chinook": the entrypoint
      # connects the init scripts to whichever database this names, and the schema script
      # below opens by dropping and recreating a database called chinook, which fails the
      # moment it is asked to drop the very database it is connected to.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chinook_local_dev}
      CHINOOK_RO_PASSWORD: ${CHINOOK_RO_PASSWORD:-chinook_ro_local_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./docker/postgres-initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chinook"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg-data:
