name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run pytest tests/unit -v

  # Everything reachable with just a database: the read-only role guarantee and the durable
  # conversation store. Neither needs Azure, so this runs on every push with no secrets
  # required.
  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: chinook_ci
          POSTGRES_DB: chinook
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant
        ports: ["6333:6333"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen

      - name: Load the Chinook schema and create the read-only role
        env:
          PGPASSWORD: chinook_ci
        run: |
          # The same schema file docker-compose.local-db.yml loads into a local Postgres, so
          # there is one copy of it rather than this job fetching its own from upstream.
          # The upstream script creates and connects to its own "chinook" database; run it as
          # the same superuser the service container already has.
          psql -h localhost -U postgres -f docker/postgres-initdb/01-chinook-schema.sql
          psql -h localhost -U postgres -d chinook <<'SQL'
            CREATE ROLE chinhook_ro WITH LOGIN PASSWORD 'chinook_ci_ro' NOSUPERUSER NOCREATEDB NOCREATEROLE;
            GRANT CONNECT ON DATABASE chinook TO chinhook_ro;
            GRANT USAGE ON SCHEMA public TO chinhook_ro;
            GRANT SELECT ON ALL TABLES IN SCHEMA public TO chinhook_ro;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO chinhook_ro;
            ALTER ROLE chinhook_ro SET default_transaction_read_only = on;
            ALTER ROLE chinhook_ro SET statement_timeout = '3s';
          SQL

      - name: Run the database-backed integration tests
        env:
          DATABASE_URL: postgresql://postgres:chinook_ci@localhost:5432/chinook?sslmode=disable
          DATABASE_URL_RO: postgresql://chinhook_ro:chinook_ci_ro@localhost:5432/chinook?sslmode=disable
          QDRANT_URL: http://localhost:6333
        run: uv run pytest tests/integration -v -m "integration and not llm"

  # The full agent workflow, needing real Azure OpenAI credentials for both the chat and the
  # embedding deployments. Skipped entirely on a fork or a repo where these secrets have not
  # been configured, rather than failing the whole pipeline over something outside this
  # code's control. Set AZURE_OPENAI_KEY, DEPLOYMENT1_NAME, AZURE_OPENAI_ENDPOINT1,
  # DEPLOYMENT2_NAME, AZURE_OPENAI_ENDPOINT2, AZURE_EMBEDDING_KEY and AZURE_EMBEDDING_ENDPOINT
  # as repository secrets to enable it.
  end-to-end-tests:
    runs-on: ubuntu-latest
    if: ${{ vars.RUN_LLM_TESTS == 'true' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: chinook_ci
          POSTGRES_DB: chinook
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant
        ports: ["6333:6333"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen

      - name: Load the Chinook schema
        env:
          PGPASSWORD: chinook_ci
        run: |
          psql -h localhost -U postgres -f docker/postgres-initdb/01-chinook-schema.sql

      - name: Run the full agent workflow against real Azure OpenAI
        env:
          DATABASE_URL: postgresql://postgres:chinook_ci@localhost:5432/chinook?sslmode=disable
          QDRANT_URL: http://localhost:6333
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          DEPLOYMENT1_NAME: ${{ secrets.DEPLOYMENT1_NAME }}
          AZURE_OPENAI_ENDPOINT1: ${{ secrets.AZURE_OPENAI_ENDPOINT1 }}
          DEPLOYMENT2_NAME: ${{ secrets.DEPLOYMENT2_NAME }}
          AZURE_OPENAI_ENDPOINT2: ${{ secrets.AZURE_OPENAI_ENDPOINT2 }}
          AZURE_EMBEDDING_KEY: ${{ secrets.AZURE_EMBEDDING_KEY }}
          AZURE_EMBEDDING_ENDPOINT: ${{ secrets.AZURE_EMBEDDING_ENDPOINT }}
        run: |
          uv run python scripts/indexer.py --full
          uv run pytest tests/integration -v -m llm
