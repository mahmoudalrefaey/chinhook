# Local development: Qdrant and the app, each in its own container, reached by URL the same
# way a hosted deployment reaches them. Then open http://localhost:8501 and connect a database
# and a model on the setup screen.
#
# To also run a sample database to connect to (PostgreSQL with the Chinook dataset and a
# read-only login already set up), layer docker-compose.local-db.yml on top:
#
#   docker compose -f docker-compose.yml -f docker-compose.local-db.yml up
#
# A database on this machine itself is reached from inside the app container as
# host.docker.internal, not localhost, which inside the container means the container.

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      # The port the app listens on inside the container; the host port is set below.
      PORT: "8501"
      # Local development only: lets the app connect to a database on this machine or in
      # this compose network. Never set this on a public deployment (see config.py).
      ALLOW_PRIVATE_HOSTS: "true"
    ports:
      - "127.0.0.1:${APP_PORT:-8501}:8501"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_started

volumes:
  qdrant-data:
