[project]
name = "chinhook"
version = "0.1.0"
description = "Ask a PostgreSQL or MySQL database questions in plain language."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44",
    "fastapi[standard]>=0.115",
    "langgraph>=1.2.12",
    "markdown>=3.5",
    "nh3>=0.3.7",
    "openai>=3.16.2",
    "pandas>=3.0.6",
    "psycopg2-binary>=2.9.13",
    "pymysql[rsa]>=1.2",
    "qdrant-client>=1.19.1",
    "sqlalchemy>=2.0",
    "sqlglot>=30.19.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# In-process embeddings (EMBED_PROVIDER=fastembed), for a Qdrant without Cloud Inference.
local-embeddings = [
    "fastembed>=0.7",
]

# What FastAPI Cloud (and `fastapi dev` / `fastapi run`) starts.
[tool.fastapi]
entrypoint = "chinhook.web.server:app"

